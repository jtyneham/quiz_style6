<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#eee9df" data-ui="browser-theme" />
  <title>Quiz</title>
  <link rel="stylesheet" href="css/theme.css" />
  <link rel="stylesheet" href="css/app.css" />
  <link rel="stylesheet" href="css/rngl.css" />
  <script type="importmap">
    { "imports": { "pixi.js": "./vendor/pixi.min.js" } }
  </script>
</head>
<body>
  <div id="quizApp" class="quiz-shell" data-ui="app-shell">
    <section id="homeScreen" class="screen screen-home active" data-ui="home-screen" aria-label="Quiz games">
      <div id="homeInkStage" class="home-ink-stage" aria-hidden="true"></div>
      <main class="hub-main">
        <section class="game-grid" data-ui="game-launcher" aria-label="Games">
          

          <button class="app-tile" data-ui="game-launch" type="button" data-file="missingword.html" data-name="Missing Word">
            <div class="tile-card" data-ui="game-launch-surface">
              <svg class="icon missing-word-icon" viewBox="0 0 120 120" aria-hidden="true">
                <!-- continuous row of answer blanks behind the question mark -->
                <path class="mw-blanks" d="M8 70h16M32 70h16M56 70h16M80 70h16M104 70h8"></path>
                <!-- deliberately overlays/covers the middle blanks -->
                <text class="mw-question" x="60" y="86" text-anchor="middle">?</text>
              </svg>
            </div>
            <span class="tile-title" data-ui="game-launch-label">Missing Word</span>
          </button>

          <button class="app-tile" data-ui="game-launch" type="button" data-file="missingwordpokemon.html" data-name="Missing Word - Pokemon">
            <div class="tile-card" data-ui="game-launch-surface">
              <svg class="icon pokemon-ball pokemon-missing-icon" viewBox="0 0 120 120" aria-hidden="true">
                <circle class="top" cx="60" cy="60" r="46"></circle>
                <path d="M14 60h92"></path>
                <circle class="center" cx="60" cy="60" r="14"></circle>
                <!-- large overlay question mark -->
                <text class="pokemon-question" x="60" y="84" text-anchor="middle">?</text>
              </svg>
            </div>
            <span class="tile-title" data-ui="game-launch-label">Missing Word - Pokemon</span>
          </button>

          <button class="app-tile" data-ui="game-launch" type="button" data-file="hangman1.html" data-name="Hangman">
            <div class="tile-card" data-ui="game-launch-surface">
              <svg class="icon hangman-icon" viewBox="0 0 120 120" aria-hidden="true">
                <path d="M17 106h58M30 106V12H84V28"></path>
                <path d="M84 28v12"></path>
                <circle cx="84" cy="50" r="10"></circle>
                <path d="M84 60v22M84 67L70 76M84 67l14 9M84 82L74 96M84 82l10 14"></path>
              </svg>
            </div>
            <span class="tile-title" data-ui="game-launch-label">Hangman</span>
          </button>

          <button class="app-tile" data-ui="game-launch" type="button" data-file="hangmanpokemon.html" data-name="Hangman - Pokemon">
            <div class="tile-card" data-ui="game-launch-surface">
              <svg class="icon hangman-pokemon-icon" viewBox="0 0 120 120" aria-hidden="true">
                <path d="M17 106h58M30 106V12H84V28"></path>
                <path d="M84 28v15"></path>
                <circle cx="84" cy="62" r="17"></circle>
                <path d="M67 62h34"></path>
                <circle cx="84" cy="62" r="5.8" fill="#fff"></circle>
              </svg>
            </div>
            <span class="tile-title" data-ui="game-launch-label">Hangman - Pokemon</span>
          </button>

          <button class="app-tile" data-ui="game-launch" type="button" data-file="rngl.html" data-name="Random Letter">
            <div class="tile-card" data-ui="game-launch-surface">
              <svg class="icon" viewBox="0 0 120 120" aria-hidden="true">
                <rect x="24" y="24" width="72" height="72" rx="10"></rect>
                <text x="60" y="76" text-anchor="middle" font-size="54">A</text>
              </svg>
            </div>
            <span class="tile-title" data-ui="game-launch-label">Random Letter</span>
          </button>

        
        </section>
      </main>
    </section>

    <section id="rnglScreen" class="screen screen-rngl" aria-label="Random Letter">
      
      
  <div class="rngl-app" data-ui="game-root">
    <header class="rngl-topbar" data-ui="game-toolbar">
      <div class="utility-actions" data-ui="utility-actions">
      <button
        id="rnglHomeButton"
        class="fullscreen-button rngl-home-button" data-ui="home-action"
        type="button"
        aria-label="Back to Home"
        title="Home"
      >
        <img src="assets/home.svg" alt="" aria-hidden="true">
      </button>

      <button
        id="fullscreenButton"
        class="fullscreen-button" data-ui="fullscreen-action"
        type="button"
        aria-label="Enter fullscreen"
        title="Fullscreen"
      >
        <img id="fullscreenIcon" src="assets/fullscreen.svg" alt="" aria-hidden="true">
        <span id="fullscreenLabel" class="visually-hidden">Fullscreen</span>
      </button>
      </div>

      <label class="ideas-control" data-ui="option-control">
        <span>Ideas</span>
        <input id="ideasToggle" type="checkbox" />
        <span class="switch" aria-hidden="true"></span>
      </label>
    </header>

    <main class="rngl-main">
      <section class="generator" aria-label="Random letter generator">
        <button
          id="letterCard"
          class="letter-card" data-ui="game-primary-surface"
          type="button"
          aria-label="Generate a random letter"
        >
          <span id="letter" class="letter" aria-live="polite">A</span>
          <span
            id="tunnelLayer"
            class="tunnel-layer"
            aria-hidden="true"
          ></span>

          <span
            id="wheelScene"
            class="wheel-scene"
            aria-hidden="true"
          >
            <span id="wheelLayout" class="wheel-layout">
              <span id="wheelVisual" class="wheel-visual">
                <svg
                  class="wheel-svg"
                  viewBox="0 0 300 300"
                  aria-hidden="true"
                >
                  <g id="wheelSpinner" class="wheel-spinner"></g>
                  <circle
                    cx="150"
                    cy="150"
                    r="29"
                    fill="#ffffff"
                    stroke="#d4dbe4"
                    stroke-width="3"
                  ></circle>
                </svg>
                <span class="wheel-pointer"></span>
              </span>

              <span id="wheelWinner" class="wheel-winner"></span>
            </span>
          </span>
        </button>

        <button id="generateButton" class="generate-button" data-ui="primary-action" type="button">
          Generate
        </button>
      </section>
    </main>

    <aside
      id="tickerShell"
      class="ticker-shell" data-ui="supporting-panel"
      aria-label="Topic ideas"
      aria-hidden="true"
    >
      <div class="ticker-stack">
        <div class="ticker-viewport">
          <div id="tickerTrack1" class="ticker-track">
            <div id="tickerGroup1A" class="ticker-group"></div>
            <div id="tickerGroup1B" class="ticker-group" aria-hidden="true"></div>
          </div>
        </div>

        <div class="ticker-viewport">
          <div id="tickerTrack2" class="ticker-track">
            <div id="tickerGroup2A" class="ticker-group"></div>
            <div id="tickerGroup2B" class="ticker-group" aria-hidden="true"></div>
          </div>
        </div>

        <div class="ticker-viewport">
          <div id="tickerTrack3" class="ticker-track">
            <div id="tickerGroup3A" class="ticker-group"></div>
            <div id="tickerGroup3B" class="ticker-group" aria-hidden="true"></div>
          </div>
        </div>

        <div class="ticker-viewport">
          <div id="tickerTrack4" class="ticker-track">
            <div id="tickerGroup4A" class="ticker-group"></div>
            <div id="tickerGroup4B" class="ticker-group" aria-hidden="true"></div>
          </div>
        </div>
      </div>
    </aside>
  </div>
    </section>

    <section id="missingWordScreen" class="screen screen-missing-word" aria-label="Missing Word">
      <quiz-missing-word></quiz-missing-word>
    </section>

    <section id="missingWordPokemonScreen" class="screen screen-missing-word-pokemon" aria-label="Missing Word - Pokemon">
      <quiz-missing-word-pokemon></quiz-missing-word-pokemon>
    </section>

    <section id="hangmanScreen" class="screen screen-hangman" aria-label="Hangman">
      <quiz-hangman></quiz-hangman>
    </section>


    <section id="hangmanPokemonScreen" class="screen screen-hangman-pokemon" aria-label="Hangman - Pokemon">
      <quiz-hangman-pokemon></quiz-hangman-pokemon>
    </section>

  </div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
